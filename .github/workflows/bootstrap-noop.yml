name: Import upstream NOOP source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap-noop.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check destination is bootstrap-only
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import complete NOOP history and code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --mirror https://github.com/ryanbr/noop.git /tmp/noop-upstream.git
          cd /tmp/noop-upstream.git
          git push "https://x-access-token:${GH_TOKEN}@github.com/steutersimon-a11y/noop_w_hydrationcoach.git" refs/heads/main:refs/heads/main --force
